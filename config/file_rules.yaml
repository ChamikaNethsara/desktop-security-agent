version: 1

file_scanning:

  included_filenames:
    - ".env"
    - "dockerfile"

  included_extensions:
    - ".json"
    - ".yaml"
    - ".yml"
    - ".toml"
    - ".ini"
    - ".cfg"
    - ".conf"
    - ".properties"
    - ".config"

  included_name_patterns:
    - "settings"
    - "config"

  excluded_directories:
    - ".git"
    - ".svn"
    - ".hg"

    - "node_modules"

    - "venv"
    - ".venv"

    - "__pycache__"

    - "build"
    - "dist"

    - ".idea"
    - ".vscode"